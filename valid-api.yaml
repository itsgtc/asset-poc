openapi: "3.0.0"
info:
  title: "Inventory Service"
  description: "Product inventory management API"
  version: "2.1.0"
paths:
  /products:
    get:
      summary: "List all products"
      responses:
        "200":
          description: "Product list"
  /products/{id}:
    get:
      summary: "Get product by ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Product details"
